name: turbofooter
label: TurboFooter
kind: standalone
version: 0.1.0
author: Alex Ivanov
license: MIT
homepage: https://github.com/alexivanovvv/hermes-turbofooter
description: >
  Richer runtime footer for the Hermes gateway: reasoning effort, context share/tokens, Codex 5-hour quota
  with a reset countdown, and on Telegram a choice of where the footer lives - inside the message (stock),
  an inline button under the reply, the chat menu button, a persistent reply keyboard or the input
  placeholder. Adds the /turbofooter command; the stock /footer stays untouched.
requires_hermes: ">=0.21"
provides_hooks: []
